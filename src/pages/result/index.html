<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/lib/cropper.min.css">
  <link rel="stylesheet" href="result.css">
</head>
<body>
  <header class="toolbar">
    <h1>Capture Full Page</h1>
    <div class="toolbar-actions">
      <button id="cropBtn" class="btn secondary-btn" style="margin-right: 8px; display: none;">Crop Image</button>
      <button id="applyCropBtn" class="btn primary-btn" style="display: none; margin-right: 8px;">Apply Crop</button>
      <button id="cancelCropBtn" class="btn secondary-btn" style="display: none; margin-right: 8px;">Cancel</button>
      <a href="../donation/index.html" target="_blank" class="btn support-btn" title="Support the Developer">Support Developer</a>
    </div>
  </header>

  <main class="preview-container">
    <div id="loading" class="loading">Loading image...</div>
    <img id="previewImage" alt="Captured Screenshot" style="display: none;">
  </main>

  <aside class="floating-action-bar" aria-label="Download Options">
    <button id="downloadPngBtn" class="btn primary-btn" title="Download as PNG" aria-label="Download as PNG">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>PNG</span>
    </button>
    <button id="downloadPdfBtn" class="btn secondary-btn" title="Download as PDF" aria-label="Download as PDF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
      <span>PDF</span>
    </button>
  </aside>

  <script src="../../assets/lib/cropper.min.js"></script>
  <script src="pdf-generator.js"></script>
  <script src="result.js"></script>
</body>
</html>
