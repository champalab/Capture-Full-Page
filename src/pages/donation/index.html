<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ສະໜັບສະໜູນນັກພັດທະນາ | Support Developer</title>
    <meta name="description" content="Support and donate to developer for their open-source work and projects.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+Lao:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <section class="glass-card donation-panel">
            <header class="profile-header">
                <div class="avatar-container">
                    <img src="https://ui-avatars.com/api/?name=Dev&background=random&size=128" alt="ChampaLab" class="avatar">
                    <div class="status-indicator"></div>
                </div>
                <h1 class="developer-name">Sonephet (Champa Lab)</h1>
                <!-- <h2 class="developer-name">ນັກພັດທະນາ (Developer)</h2> -->
                <p class="bio">ສ້າງສັນຜົນງານ ແລະ ໂປຣເຈັກດີໆ ເພື່ອຊຸມຊົນ. ຫາກທ່ານມັກຜົນງານຂອງຂ້ອຍ, ສາມາດສະໜັບສະໜູນໄດ້ທີ່ນີ້!</p>
                <div class="direct-contact">
                    <a href="tel:+8562091116465" class="contact-btn phone">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        ເບີໂທຕິດຕໍ່
                    </a>
                    <a href="https://wa.me/8562091116465?text=ຂ້ອຍຕ້ອງການ ສະໜັບສະໜູນ ຂໍຂໍ້ມູນການຊຳລະເງິນແດ່" class="contact-btn whatsapp" target="_blank">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        WhatsApp
                    </a>
                </div>
            </header>

            <form id="donation-form" class="donation-form">
                <div class="amount-selection">
                    <label class="amount-btn">
                        <input type="radio" name="amount" value="5" checked>
                        <span class="btn-content"><span>☕️</span> 5$</span>
                    </label>
                    <label class="amount-btn">
                        <input type="radio" name="amount" value="10">
                        <span class="btn-content"><span>🍔</span> 10$</span>
                    </label>
                    <label class="amount-btn">
                        <input type="radio" name="amount" value="25">
                        <span class="btn-content"><span>🚀</span> 25$</span>
                    </label>
                    <label class="amount-btn custom-amount">
                        <input type="radio" name="amount" value="custom">
                        <span class="btn-content">ອື່ນໆ...</span>
                    </label>
                </div>

                <div class="custom-amount-input hidden" id="custom-amount-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="custom-amount" min="1" placeholder="ຈຳນວນເງິນ">
                </div>

                <div class="message-input">
                    <textarea placeholder="ຝາກຂໍ້ຄວາມໃຫ້ກຳລັງໃຈ..." rows="3"></textarea>
                </div>

                <div class="payment-methods">
                    <button type="button" class="pay-btn crypto" title="Donate with Crypto">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 18V6"></path></svg>
                        Crypto
                    </button>
                    <button type="button" class="pay-btn paypal" title="Donate with PayPal">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V7a5 5 0 0 1 10 0v4"></path><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect></svg>
                        PayPal
                    </button>
                </div>

                <button type="submit" class="donate-submit">
                    <span class="submit-text">Donate Now</span>
                    <span class="glow-effect"></span>
                </button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
