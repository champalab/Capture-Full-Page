<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capture Full Page</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Capture Full Page</h1>
      <p class="subtitle" data-lang-en="Take a full-page screenshot" data-lang-lo="ຖ່າຍຮູບເຕັມໜ້າຈໍ">Take a full-page screenshot</p>
    </header>

    <main>




      <button id="captureBtn" class="primary-btn">
        <span class="btn-text" data-lang-en="Capture Full Page" data-lang-lo="ຖ່າຍຮູບເຕັມໜ້າ">Capture Full Page</span>
      </button>

      <div id="progressContainer" class="hidden">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText">0%</p>
      </div>

      <div id="statusMessage" class="status-message hidden"></div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
